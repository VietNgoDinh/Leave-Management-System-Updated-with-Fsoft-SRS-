      - REQ-008
      - REQ-009
    baseline: TO_BE
  - id: Q-012
    question: Can anyone submit a leave request on behalf of an employee (e.g. a Project Manager for a
      team member, or HR)? The URS says "Project Managers submitting for themselves", which may imply
      they can also submit for others.
    reason: §4.2 wording is ambiguous; §4.6 gives submission only to the Employee role.
    impact_if_unanswered: An on-behalf submission function and its permission would be left out.
    target_stakeholder: BUSINESS
    priority: MEDIUM
    status: OPEN
    blocking: false
    related:
      - REQ-001
      - REQ-007
    baseline: TO_BE
  - id: Q-013
    question: 'How are leave days counted: are weekends and public holidays excluded, which days are working
      days in each country or office, and who maintains the public holiday calendars?'
    reason: The URS does not define working days; with offices in several countries (§4.8), calendars
      differ, and the weekly off-work check (§4.3) must skip non-working days.
    impact_if_unanswered: Leave duration and off-work-day detection would use guessed calendars.
    target_stakeholder: BUSINESS
    priority: MEDIUM
    status: OPEN
    blocking: false
    related:
