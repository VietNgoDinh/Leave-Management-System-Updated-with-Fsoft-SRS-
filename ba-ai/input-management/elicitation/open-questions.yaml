items:
  - id: Q-001
    question: 'Where do the people and organisation data come from: employees (including gender and service
      start date for seniority), the organisational structure (country, city, office, unit, department),
      each employee''s Line Manager and each project''s members and Project Manager? Options: (a) maintained
      in this system by Admin/HR; (b) imported or synchronised from existing HR / project systems (which
      ones?); (c) a mix (say which data comes from where).'
    reason: The URS needs these data for routing (§4.2), eligibility and entitlements (§4.4, §4.5) and
      access and reporting scope (§4.8), but names only the card scanner system as an integration and
      gives no source for them.
    impact_if_unanswered: The system boundary, the integrations, the Admin/HR functions and the data model
      of employees and organisation cannot be defined; the overview would have to guess the scope.
    target_stakeholder: BUSINESS
    priority: HIGH
    status: ANSWERED
    blocking: true
    related:
      - REQ-006
      - REQ-008
      - REQ-017
      - REQ-023
      - REQ-027
    baseline: TO_BE
    answer_source: meeting-minutes/MoM 01 Oct 2026.docx
    answer: '"They are imported from existing HR systems." (option b). The minutes do not name the HR
      systems, the interface or the import frequency: follow-up question Q-030.'
  - id: Q-002
    question: 'Who confirms a leave request when the employee belongs to several projects (several Project
      Managers) or to no project? Options: (a) every Project Manager of the projects the leave dates affect;
      (b) any one of them; (c) a designated primary Project Manager; (d) with no project, the request
      goes straight to the Line Manager.'
    reason: §4.2 assumes one Project Manager per employee; the URS does not say how confirmation is routed
      otherwise.
    impact_if_unanswered: The core confirmation path and the employee-project relationship in the data
      model would be guessed.
    target_stakeholder: BUSINESS
    priority: HIGH
    status: ANSWERED
    blocking: true
    related:
      - REQ-006
      - REQ-007
      - REQ-020
    baseline: TO_BE
    answer_source: meeting-minutes/MoM 01 Oct 2026.docx
    answer: '"The employee can choose the PM from their assigned projects." This settles the several-projects
      case: the employee chooses which Project Manager confirms (ASM-014). The minutes do not answer the
      no-project case: follow-up question Q-031.'
  - id: Q-003
    question: 'What happens to a leave request that is not confirmed or not approved by the end of the
      calendar month of its leave start date? Options: (a) it stays pending and can still be acted on;
      (b) it expires or is cancelled automatically; (c) it is rejected automatically; (d) it is approved
      automatically; (e) it is escalated (to whom?). And how does the rule apply to leave that spans two
      months, or to a past-date request submitted on the last day of the month?'
    reason: §4.2 and §6 require review and approval within the calendar month of the leave start date
      but do not say what the system does when the deadline passes.
    impact_if_unanswered: The request lifecycle (statuses and transitions) and any month-end scheduled
      job cannot be specified.
    target_stakeholder: BUSINESS
    priority: HIGH
    status: ANSWERED
    blocking: true
    related:
      - REQ-009
      - REQ-006
      - REQ-008
      - REQ-001
    baseline: TO_BE
    answer_source: meeting-minutes/MoM 01 Oct 2026.docx
    answer: 'Outcome at the deadline: "It''s cancelled" (option b). Leave spanning two months and past-date
      requests on the last day of the month: "As long as the leave duration requested is not from the
      previous month of current month, it is valid." The minutes do not say who cancels (ASM-012) or when
      exactly the cut-off is (Q-034), nor how a period that straddles the previous and the current month
      is handled (ASM-013).'
  - id: Q-004
    question: 'How is a policy-violating leave request reviewed? (1) Who performs the "manual review":
      the normal Project Manager then Line Manager steps with the violation highlighted, or an additional
      review (e.g. by HR)? (2) Which violations are allowed through (e.g. exceeding the remaining entitlement,
      a leave type the employee is not eligible for, a missing required document)? (3) If approved, what
      happens to the excess (negative balance, converted to unpaid leave, other)?'
    reason: §3 and §4.1 allow submission despite a policy violation "subject to review" without saying
      who reviews, which violations qualify or how an approved violation is accounted for.
    impact_if_unanswered: The review workflow could gain an extra actor and step, and the entitlement
      accounting rules would be guessed.
    target_stakeholder: BUSINESS
    priority: HIGH
    status: ANSWERED
    blocking: true
    related:
      - REQ-002
      - REQ-003
      - REQ-004
    baseline: TO_BE
    answer_source: meeting-minutes/MoM 01 Oct 2026.docx
    answer: '(1) "Who reviews: the line manager." (2) "Leave exceed entitlement is allowed." (3) "If approved,
      what happens to the excess: The balance stay at 0." Not answered: whether the Project Manager still
      confirms first (ASM-011), whether other violations (ineligible leave type, missing document) are
      allowed (Q-032), and whether the excess days are recorded anywhere (Q-033).'
  - id: Q-005
    question: Are leave types, eligibility rules and seniority-based entitlements the same for the whole
      company, or defined per country (or per office or legal entity), since government regulations differ
      between the countries the company operates in?
    reason: §4.5 bases Paid Leave on government regulations, and §4.8 states the company operates in several
      countries, but the URS describes a single set of leave types.
    impact_if_unanswered: The data model of leave types and entitlements (global or country-scoped) and
      the Admin/HR configuration functions would be guessed.
    target_stakeholder: COMPLIANCE
    priority: HIGH
    status: OPEN
    blocking: true
    related:
      - REQ-016
      - REQ-017
      - REQ-014
      - REQ-019
      - REQ-023
    baseline: TO_BE
  - id: Q-006
    question: 'In which unit is leave requested and counted? Options: (a) full days only; (b) full and
      half days (morning / afternoon); (c) hours.'
    reason: The URS does not state the unit; the 4-hour presence threshold in §4.3 suggests partial days
      may matter.
    impact_if_unanswered: The leave request and entitlement data model and the off-work-day matching would
      be guessed.
    target_stakeholder: BUSINESS
    priority: HIGH
    status: ANSWERED
    blocking: true
    related:
      - REQ-001
      - REQ-014
      - REQ-011
    baseline: TO_BE
    answer_source: meeting-minutes/MoM 01 Oct 2026.docx
    answer: '"full and half days (morning / afternoon)" (option b). How a half day counts against the
      entitlement: ASM-015.'
  - id: Q-007
    question: 'What does the annual refresh do, and is it the same as the year-start entitlement import?
      In particular: are unused days carried over (up to what limit, until when) or forfeited, and is
      the refresh triggered by Admin/HR or run automatically on a fixed date?'
    reason: §4.1 says leave data is refreshed annually and §4.6 that Admin/HR manages it, while §4.4 describes
      a separate import at the beginning of the year.
    impact_if_unanswered: The year-end process could be specified as one function or two, and carry-over
      rules would be missing.
    target_stakeholder: BUSINESS
    priority: HIGH
    status: OPEN
    blocking: false
    related:
      - REQ-014
      - REQ-015
    baseline: TO_BE
  - id: Q-008
    question: Can an employee cancel or withdraw a leave request, or change one that is still pending?
      If so, until when (before confirmation, before approval, after approval but before the leave starts),
      and does a change to an approved request go through review again?
    reason: The URS mentions modification only after denial or rejection (§4.2).
    impact_if_unanswered: Cancellation and edit functions would be left out of scope; adding them later
      re-opens the approved overview.
    target_stakeholder: BUSINESS
    priority: HIGH
    status: OPEN
    blocking: false
    related:
      - REQ-001
      - REQ-010
      - REQ-005
    baseline: TO_BE
  - id: Q-009
    question: 'When is the employee''s remaining entitlement reduced: on submission (reserved), on confirmation,
      or on final approval? Is it restored when a request is denied, rejected or cancelled?'
    reason: The URS describes entitlements (§4.4) and the workflow (§4.2) but not how they interact.
    impact_if_unanswered: Balance checks during validation and the balance shown to employees and reviewers
      would be guessed.
    target_stakeholder: BUSINESS
    priority: HIGH
    status: OPEN
    blocking: false
    related:
      - REQ-002
      - REQ-014
    baseline: TO_BE
  - id: Q-010
    question: Who approves the leave of a Line Manager, and who confirms and approves when the employee's
      Project Manager and Line Manager are the same person?
    reason: §4.2 covers only the Project Manager's own requests (auto-confirmed).
    impact_if_unanswered: The routing of these requests would be guessed.
    target_stakeholder: BUSINESS
    priority: MEDIUM
    status: OPEN
    blocking: false
