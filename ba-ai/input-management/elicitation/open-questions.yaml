      - REQ-023
    baseline: TO_BE
  - id: Q-014
    question: 'For the Friday attendance notification: (1) which period does it cover (the past week,
      the month to date, other)? (2) Does a "valid leave request" mean an approved one only, or also one
      still pending? (3) Who receives it: the employee only, or also the Project Manager / Line Manager
      / HR? (4) At what time is it sent, in each office''s local time zone?'
    reason: §4.3 states the day and the two lists but not the period, the validity rule, the recipients
      or the time.
    impact_if_unanswered: The scheduled notification job and its email template would be specified on
      guesses.
    target_stakeholder: BUSINESS
