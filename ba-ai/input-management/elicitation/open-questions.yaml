      verb). Please confirm the priority of each requirement, in particular whether submission, confirmation
      and approval are must-haves.
    reason: Priorities were derived from "must" (HIGH) and "should" (MEDIUM); requirements without either
      are MEDIUM by default.
    impact_if_unanswered: Backlog planning would rely on default priorities.
