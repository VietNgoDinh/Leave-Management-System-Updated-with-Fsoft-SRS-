      - REQ-012
    baseline: TO_BE
  - id: Q-015
    question: How should the off-work check treat employees who do not use a card scanner on a given day,
      e.g. remote work, business trips, client-site work, part-time schedules, or offices without scanners?
    reason: §4.3 treats a missing check-in as an off-work day, which would flag such employees as absent
      without leave.
    impact_if_unanswered: Employees could receive incorrect absence notifications.
    target_stakeholder: OPERATIONS
    priority: MEDIUM
    status: OPEN
    blocking: false
    related:
      - REQ-011
      - REQ-012
    baseline: TO_BE
