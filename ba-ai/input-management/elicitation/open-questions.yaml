  - id: Q-011
    question: Can a Project Manager or Line Manager delegate confirmation or approval to someone else
      while they are absent? If so, who can be a delegate and for how long?
    reason: The URS does not mention delegation, yet reviews must be completed within the month (§6),
      which an absent reviewer could prevent.
    impact_if_unanswered: Requests may miss the month deadline while a reviewer is away; no delegation
      function is specified.
    target_stakeholder: BUSINESS
    priority: MEDIUM
    status: OPEN
    blocking: false
    related:
