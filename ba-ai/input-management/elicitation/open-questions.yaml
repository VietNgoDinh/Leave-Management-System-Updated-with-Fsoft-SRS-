  - id: Q-035
    question: Leave can be taken in half days (morning / afternoon). How does the weekly attendance check
      (a day is off work with no check-in or with less than 4 hours of presence) treat a day with a half-day
      leave? For example, if an employee has a half-day leave and less than 4 hours of presence, is the
      day reported as off work with a valid leave request, as off work without a leave request, or not
      reported at all?
    reason: The URS's 4-hour rule (§4.3) was written without half-day leave, which the minutes now introduce.
    impact_if_unanswered: The weekly notification could wrongly report half-day leave as absence without
      leave, or hide real absences.
    target_stakeholder: BUSINESS
    priority: MEDIUM
    status: OPEN
    blocking: false
