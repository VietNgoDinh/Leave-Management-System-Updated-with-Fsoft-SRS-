schema_version: 2
# The single route definition (addendum D-22). Read by tools/ba; explained in workflow.md.
# implemented: false marks phases that have no engine yet.
# Milestone 2 (addendum §13) adds every MODE_B engine. §14 (D-45 – D-64) aligns the artifacts with the
# company SRS structure: folders, use cases as functions, step rules, the behaviour step before sequence
# and API, the no-UI path for system use cases, and the site map of every user-facing application.
milestone: 2

modes:
  MODE_A:
    name: Existing product / existing system
    route:
      - {id: BOOTSTRAP, kind: step, implemented: true, outputs: [workflow/state.json]}
      - {id: REVERSE_ENGINEERING, kind: step, implemented: false, outputs: [current-state/architecture/system-landscape.md]}
      - {id: GATE-01, kind: gate}
      - {id: TECH_BASELINE, kind: step, implemented: false, outputs: [technical/architecture/architecture.md]}
      - {id: GATE-09, kind: gate}
      - {id: ELICITATION, kind: run_step}
      - {id: OVERVIEW, kind: run_step}
      - {id: GATE-02, kind: gate}
      - {id: PLANNING, kind: run_step}
      - {id: INFORMATION_ARCHITECTURE, kind: run_step}
      - {id: DELIVERY, kind: use_case_engine}

  MODE_B:
    name: New product / major new business capability
    route:
      - {id: BOOTSTRAP, kind: step, implemented: true, outputs: [workflow/state.json]}
      - {id: ELICITATION, kind: run_step}
      - {id: OVERVIEW, kind: run_step}
      - {id: GATE-02, kind: gate}
      - {id: TECH_BASELINE, kind: run_step}
      - {id: GATE-09, kind: gate}
      - {id: PLANNING, kind: run_step}
      - {id: INFORMATION_ARCHITECTURE, kind: run_step}
      # Per use case: Spec Engine → GATE-05 → GATE-06 → acceptance tests → coding → QA + fix loop → GATE-10
      # → [GATE-07] → user guide → GATE-08 (D-37, D-38)
      - {id: DELIVERY, kind: use_case_engine}

  MODE_C:
    name: Small change request
    route:
      - {id: BOOTSTRAP, kind: step, implemented: true, outputs: [workflow/state.json]}
      - {id: CR_INTAKE, kind: step, implemented: false}
      - {id: IMPACT_ANALYSIS, kind: step, implemented: false}
      - {id: DELIVERY, kind: use_case_engine}

# Run-level engines (master spec Phases 2, 3, 4, 4A, 6A). Each step:
#   agent / skills   who does the work and which method skills it follows
#   requires_input   folders that must hold material before the step can run
#   outputs          documents it writes; built_from = the inputs `tools/ba stamp` records (a trailing ?
#                    marks an optional input that may still be empty)
#   per_item         one document per catalog item (a workflow per business process, a site map per
#                    user-facing application); `where: user_facing` keeps applications used by a HUMAN actor
#   catalogs         catalogs it fills (through `tools/ba catalog`); each must end up with at least one item
#   stories          every planned use case has at least one user story (D-60)
# A step is complete once the next gate on the route approves its outputs, or — with no gate after it —
# once its outputs exist, are current and are valid (see `tools/ba next`).
run_steps:
  ELICITATION:
    phase: "2"
    name: Requirement Elicitation
    agent: elicitation-agent
    skills: [elicit-requirements, generate-clarification-questions]
    requires_input: [input-management/user-requirements/]
    outputs:
      - path: input-management/elicitation/elicitation-summary.md
        built_from: [input-management/user-requirements/, "input-management/meeting-minutes/?",
                     "input-management/reference-documents/?"]
    catalogs: [requirements, glossary]
    stakeholder_wait: true        # OPEN questions marked blocking → WAITING_FOR_HUMAN (master §8 step 2.5)
  OVERVIEW:
    phase: "3"
    name: Overview Analysis
    agent: overview-analysis-agent
    skills: [write-product-overview, model-business-processes, extract-business-rules, build-data-model,
             define-use-cases, adapt-company-standards]
    outputs:
      - path: high-level-requirements/product-overview.md
        built_from: ["input-management/elicitation/elicitation-summary.md?",
                     input-management/elicitation/requirements.yaml]
      # D-53: the company's conventions, adapted for the product (no inputs: they start from company-standards/)
      - path: other-requirements/field-controls.md
        built_from: []
      - path: other-requirements/message-configuration.md
        built_from: []
      - path: other-requirements/list-behaviour.md
        built_from: []
    per_item:
      # D-56: one workflow document per process. Its stamp records the process (its ID is the document's id),
      # so changing the process's steps or branches makes the workflow STALE.
      - path: high-level-requirements/workflows/{BP}.md
        catalog: business-processes
        built_from: []
    catalogs: [actors, applications, business-processes, business-rules, entities, use-cases]
    # common-use-cases.yaml is a GATE-02 artifact, so it must exist; it may be empty (`tools/ba catalog init`)
    # when the product has no "Manage X" function.
  TECH_BASELINE:
    phase: "6A"
    name: Technical Architecture Baseline (designed)
    agent: technical-baseline-agent
    skills: [design-technical-baseline]
    outputs:
      - path: technical/architecture/architecture.md
        built_from: [high-level-requirements/product-overview.md, high-level-requirements/applications.yaml,
                     "high-level-requirements/integrations.yaml?", high-level-requirements/objects.yaml]
      - path: technical/coding-rules/frontend.md
        built_from: [technical/architecture/architecture.md]
      - path: technical/coding-rules/backend.md
        built_from: [technical/architecture/architecture.md]
      - path: technical/security/security-rules.md
        built_from: [technical/architecture/architecture.md]
      - path: technical/design-system.md
        built_from: [high-level-requirements/product-overview.md, high-level-requirements/applications.yaml,
                     other-requirements/field-controls.md, other-requirements/list-behaviour.md]
    catalogs: [services, repositories]
  PLANNING:
    phase: "4"
    name: BA Planning
    agent: planning-agent
    skills: [plan-backlog]
    backlog: true                 # every use case in the catalog must be planned into an epic
    stories: true                 # and have at least one user story (D-60)
    catalogs: [user-stories]
  INFORMATION_ARCHITECTURE:
    phase: 4A
    name: Site Map (Information Architecture)
    agent: planning-agent
    skills: [design-site-map]
    per_item:
      - path: high-level-requirements/site-map/{APP}.md       # D-58: every user-facing application
        catalog: applications
        where: user_facing
        built_from: [high-level-requirements/product-overview.md, high-level-requirements/actors.yaml,
                     high-level-requirements/applications.yaml, high-level-requirements/use-cases.yaml]

# Human gates (master spec §37 + addendum D-08). Artifact paths are relative to ba-ai/;
# {UC} is the use case, a trailing / means "the whole folder".
# revise_agent: who applies reviewer comments (run-level gates; on a use-case gate it narrows the owners).
# pre_review: an AI reviewer with a fresh context checks the artifacts before the human sees them (D-40).
# views: generated read-only views the reviewer reads next to the YAML (never hashed: the YAML is).
pre_review:
  max_rounds: 2                 # after two rounds the gate is requested anyway, with any findings left listed
gates:
  GATE-01:
    name: CURRENT_STATE_REVIEW
    subject: RUN
    reviewer: BA (processes, use cases) + SA/Developer (architecture)
    implemented: false
  GATE-02:
    pre_review: true
    name: OVERVIEW_APPROVAL
    subject: RUN
    reviewer: BA
    implemented: true
    revise_agent: overview-analysis-agent
    review_focus:
      - Requirements typed FUNCTIONAL or NON_FUNCTIONAL; every NFR has a category and measurable criteria
      - Glossary — terms, abbreviations and notation the documents use
      - Business processes and their workflow documents (swimlane diagram and explanation)
      - Use cases as functions — objective, object, allowed states and the permission matrix (O / O* / O** / X)
      - Use case diagram — every function an actor needs, with risk_level / risk_flags
      - Objects (data model) — attributes and their constraints, relationships, lifecycle (state transitions)
      - Business rules — policy rules, and the common rules (kind COMMON) use cases apply by reference
      - Company conventions — common use cases (CMUC), field controls, messages, list behaviour
      - Integrations and system boundaries
    artifacts:
      - high-level-requirements/product-overview.md
      - input-management/elicitation/requirements.yaml
      - appendices/glossary.yaml
      - high-level-requirements/actors.yaml
      - high-level-requirements/applications.yaml
      - high-level-requirements/business-processes.yaml
      - high-level-requirements/workflows/
      - high-level-requirements/business-rules.yaml
      - high-level-requirements/objects.yaml
      - high-level-requirements/integrations.yaml
      - high-level-requirements/use-cases.yaml
      - functional-requirements/common-use-cases.yaml
      - other-requirements/
    views:
      - high-level-requirements/object-relationship-diagram.view.md
      - high-level-requirements/state-transition.view.md
      - high-level-requirements/use-case-diagram.view.md
      - high-level-requirements/permission-matrix.view.md
      - non-functional-requirements/non-functional-requirements.view.md
  GATE-03:
    pre_review: true
    name: UI_MARKDOWN_REVIEW
    subject: USE_CASE
    reviewer: BA
    implemented: true
    review_focus:
      - Screen flow and navigation
      - Each screen's component table — component types from the field controls, editable, mandatory, default value
      - Missing information (components, columns, data source and default sorting of lists, states)
      - Every message shows its code (EMSG, IEM, CFD, SCD, INF) and the catalog text
      - Every button refers to the use case it triggers
      - Alignment with the use case, its rules and its permissions
      - Usability
    artifacts:
      - functional-requirements/mockup-screens/{UC}.md
  GATE-04:
    pre_review: true
    name: HTML_PROTOTYPE_REVIEW
    subject: USE_CASE
    reviewer: BA or stakeholder
    implemented: true
    review_focus:
      - Open index.html in a browser and click through every path
      - Navigation, controls, dialogs
      - Validation messages and error/success behaviour
      - States (empty, loading, error) via the prototype controls panel
    artifacts:
      - functional-requirements/mockup-screens/prototypes/{UC}/
  GATE-05:
    pre_review: true
    name: BA_SPEC_APPROVAL
    subject: USE_CASE
    reviewer: BA
    implemented: true
    review_focus:
      - The compiled specification reads as one consistent, code-ready story in the company layout
      - The activities flow and its step rules (Step | BR Code | Description) match the approved screens
      - Every Validating rule shows a message code; every Confirmation rule a CFD code
      - Common use cases followed — the specification states only what differs from them
      - Email templates — recipients, subject, body, every placeholder bound to its source
      - Acceptance criteria are testable and cover every step rule, alternate and error flow
      - Open questions and assumptions are acceptable to carry forward
      - Sequence and API design match the behaviour (SA reviews them in depth at GATE-06)
    artifacts:
      - functional-requirements/use-case-specifications/{UC}/behaviour.md
      - technical/sequence/{UC}.md
      - technical/api/{UC}.md
      - functional-requirements/use-case-specifications/{UC}/acceptance.md
      - functional-requirements/use-case-specifications/{UC}/spec.md
  GATE-06:
    pre_review: true
    name: TECHNICAL_APPROVAL
    subject: USE_CASE
    reviewer: SA / Developer
    implemented: true
    review_focus:
      - API design — methods, paths, payloads, status codes, conventions of the baseline
      - Service boundaries and cross-service calls in the sequence
      - Security — authentication, authorization (the permission matrix), data protection
      - Integration approach and database impact
      - Performance concerns and technical feasibility
      - TECHNICAL open questions the analysis left for you
    # D-11: only the technical artifacts. A change that leaves them untouched keeps GATE-06 valid.
    artifacts:
      - technical/sequence/{UC}.md
      - technical/api/{UC}.md
  GATE-07:
    name: CRITICAL_FLOW_TEST
    subject: USE_CASE
    reviewer: BA / QA
    implemented: true
    required_when: risk           # D-23: risk_level HIGH/CRITICAL, or any risk flag
    review_focus:
      - Run the critical journeys yourself in the test environment (test-results lists how)
      - Financial, irreversible, security- or compliance-sensitive behaviour
      - Automated results and the defects fixed along the way
    artifacts:
      - qa/test-cases/{UC}.md
      - qa/test-results/{UC}.md
  GATE-08:
    pre_review: true
    name: USER_GUIDE_REVIEW
    subject: USE_CASE             # one guide per use case (addendum D-35)
    reviewer: BA
    implemented: true
    review_focus:
      - Terminology matches the glossary and the product
      - Screenshots show the implemented application, step by step
      - Process accuracy against the approved flow
      - Clarity for the actor who uses the feature
    artifacts:
      - user-guide/{UC}/
  GATE-09:
    pre_review: true
    name: TECH_BASELINE_APPROVAL
    subject: RUN
    reviewer: SA / Tech lead
    implemented: true
    revise_agent: technical-baseline-agent
    review_focus:
      - Technology stack and application architecture
      - API conventions (the spec engine designs APIs against them)
      - Security rules — how the permission matrix is enforced, error handling, logging, testing conventions
      - Design system — visual design only (behaviour conventions are Other Requirements, approved at GATE-02)
      - TECHNICAL open questions — choices only the SA can make
    artifacts:
      - technical/architecture/architecture.md
      - technical/architecture/services.yaml
      - technical/coding-rules/frontend.md
      - technical/coding-rules/backend.md
      - technical/security/security-rules.md
      - technical/design-system.md
  GATE-10:
    pre_review: true
    name: CODE_REVIEW
    subject: USE_CASE
    reviewer: Developer (pull request review)
    implemented: true
    revise_agent: coding-agent
    review_focus:
      - Review the branch named in the implementation summary (diff against the main branch)
      - Every change traces to the use case or an acceptance criterion
      - No unrelated modules rewritten; project conventions followed
      - The acceptance tests are green (test results) and were not edited by the implementation
    # D-37: requested after automated QA passed, so the developer reviews the final, tested code once.
    artifacts:
      - technical/implementation/{UC}.md
      - qa/test-results/{UC}.md

# Per-use-case engine (master spec Phases 5–9). Runs for each use case in the run's scope.
# ui: true marks the UI steps a system use case skips — every actor SYSTEM and no screen lists it (D-57).
use_case_engine:
  requires_gates: [GATE-02, GATE-09]   # run-level approvals needed before any use case starts
  dependency_gate: GATE-05             # a dependency is satisfied when its spec is approved
  max_fix_attempts: 3                  # D-26: automated fix attempts per defect
  steps:
    - step: "5.1"
      name: Context Discovery
      phase: SPECIFICATION
      executor: orchestrator
      command: tools/ba context {UC}
    - step: "5.2"
      name: Functional Screen Design (Markdown)
      phase: SPECIFICATION
      agent: ui-agent
      skills: [design-screen-markdown]
      artifact_type: ui-markdown
      built_from: []
      gate: GATE-03
      ui: true
    - step: "5.3"
      name: Interactive HTML Prototype
      phase: SPECIFICATION
      agent: ui-agent
      skills: [build-html-prototype]
      artifact_type: ui-prototype
      built_from: [ui-markdown]
      gate: GATE-04
      ui: true
    # D-48: business behaviour comes right after the approved screens; sequence and API are derived from it.
    - step: "5.4"
      name: Use Case Behaviour (activities flow, step rules, emails)
      phase: SPECIFICATION
      agent: spec-agent
      skills: [write-use-case-behaviour]
      artifact_type: use-case-behaviour
      built_from: ["ui-markdown?", "ui-prototype?"]
    - step: "5.5"
      name: Sequence Analysis
      phase: SPECIFICATION
      agent: technical-analysis-agent
      skills: [generate-sequence-diagram]
      artifact_type: sequence
      built_from: [use-case-behaviour, "ui-markdown?", "ui-prototype?"]
    - step: "5.6"
      name: API Analysis and Design
      phase: SPECIFICATION
      agent: technical-analysis-agent
      skills: [design-api]
      artifact_type: api-design
      built_from: [sequence, use-case-behaviour]
    - step: "5.7"
      name: Acceptance Criteria
      phase: SPECIFICATION
      agent: spec-agent
      skills: [write-acceptance-criteria]
      artifact_type: acceptance-criteria
      built_from: [use-case-behaviour, api-design, "ui-markdown?"]
    - step: "5.8"
      name: Compile Code-Ready BA Specification
      phase: SPECIFICATION
      agent: spec-agent
      skills: [compile-use-case-spec]
      artifact_type: use-case-specification
      built_from: [use-case-behaviour, sequence, api-design, acceptance-criteria, "ui-markdown?", "ui-prototype?"]
      gate: GATE-05
    - step: "6"
      name: Technical / SA Review
      phase: TECHNICAL_REVIEW
      executor: orchestrator
      gate: GATE-06
    # needs_repositories: the product repositories must exist first (SETUP_REPOSITORIES, D-39).
    # pre_command: D-13 — `tools/ba coding authorize` checks GATE-05, GATE-06 and GATE-09 before repo writes.
    - step: "8.1"
      name: Acceptance Tests First
      phase: TEST_DESIGN           # D-38: written by the QA agent before any code, from the approved spec
      agent: qa-agent
      skills: [generate-test-cases]
      artifact_type: test-cases
      built_from: [use-case-specification, acceptance-criteria, use-case-behaviour, api-design, "ui-prototype?"]
      needs_repositories: true
      pre_command: tools/ba coding authorize {UC}
    - step: "7"
      name: Implementation
      phase: CODING
      agent: coding-agent
      skills: [implement-use-case]
      artifact_type: implementation
      built_from: [use-case-specification, api-design, "ui-prototype?"]
      needs_repositories: true
      pre_command: tools/ba coding authorize {UC}
    - step: "8.2"
      name: Execute Tests and Compare with Requirements
      phase: QA
      agent: qa-agent
      skills: [execute-tests]
      artifact_type: test-results
      built_from: [test-cases, implementation, "defects?"]
      qa_loop: true                # steps 8.3–8.4: classify failures, fix loop, hand-off to a human
      needs_repositories: true
      pre_command: tools/ba coding authorize {UC}
    - step: CODE_REVIEW
      name: Code Review (after QA passed)
      phase: CODE_REVIEW
      executor: orchestrator
      gate: GATE-10
    - step: CRITICAL_FLOW_TEST
      name: Critical Flow Test
      phase: CRITICAL_FLOW_TEST
      executor: orchestrator
      gate: GATE-07                # only when required (D-23)
    - step: "9"
      name: User Guide
      phase: USER_GUIDE
      agent: documentation-agent
      skills: [write-user-guide]
      artifact_type: user-guide
      built_from: [use-case-specification, implementation, test-results]
      needs_repositories: true
      pre_command: tools/ba coding authorize {UC}     # the screenshot script is committed in the frontend worktree
      gate: GATE-08
  # How backlog stage fields are derived. approved_as: the value once every gate of the stage is approved.
  stages:
    ui_status:
      artifact_types: [ui-markdown, ui-prototype]
      gates: [GATE-03, GATE-04]
      ui: true                     # NOT_APPLICABLE for a system use case with no screens (D-57)
    spec_status:
      artifact_types: [use-case-behaviour, sequence, api-design, acceptance-criteria, use-case-specification]
      gates: [GATE-05]
    technical_review_status:
      artifact_types: []
      gates: [GATE-06]
    coding_status:
      artifact_types: [implementation]
      gates: [GATE-10]
      approved_as: DONE
    testing_status:
      artifact_types: [test-cases, test-results]
      gates: [GATE-07]
      approved_as: DONE
      qa: true
    documentation_status:
      artifact_types: [user-guide]
      gates: [GATE-08]
      approved_as: DONE
