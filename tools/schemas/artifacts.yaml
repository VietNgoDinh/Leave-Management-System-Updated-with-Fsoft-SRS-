schema_version: 2

# One status set per level (addendum D-07).
enums:
  artifact_status: [DRAFT, WAITING_FOR_REVIEW, CHANGES_REQUESTED, APPROVED, STALE, SUPERSEDED]
  baseline: [AS_IS, TO_BE]
  origin: [AI, HUMAN, CODE, FIXTURE]
  run_status: [NOT_STARTED, IN_PROGRESS, WAITING_FOR_HUMAN, CHANGES_REQUESTED, BLOCKED, FAILED, COMPLETED]
  backlog_item_status: [BACKLOG, READY, IN_PROGRESS, BLOCKED, DONE]
  # NOT_APPLICABLE: the stage has no step for this use case (the UI stage of a system use case, D-57)
  backlog_stage_status: [NOT_STARTED, IN_PROGRESS, WAITING_FOR_REVIEW, CHANGES_REQUESTED, APPROVED, DONE, BLOCKED, STALE,
                         NOT_APPLICABLE]
  gate_status: [NOT_REQUESTED, WAITING, APPROVED, CHANGES_REQUESTED, BLOCKED, INVALIDATED, OUTDATED]
  priority: [HIGH, MEDIUM, LOW]
  test_outcome: [PASSED, FAILED, BLOCKED]
  defect_classification: [CODE_DEFECT, SPECIFICATION_GAP, TEST_ISSUE, ENVIRONMENT_ISSUE, UNRESOLVED]
  defect_status: [OPEN, FIXED, UNRESOLVED]
  test_category: [FUNCTIONAL, VALIDATION, API, INTEGRATION, REGRESSION, PERMISSION, STATE_TRANSITION,
                  NEGATIVE, BOUNDARY]
  # D-47: the fixed step-rule types. The rule's title names it in the company's words: "Submitting Rules".
  step_rule_type: [SCREEN_DISPLAYING, VALIDATING, CONFIRMATION, PROCESSING, DISPLAY_SEARCH, SCHEDULED]
  # D-46: permission of an actor on a function — matrix symbols O, O*, O**, X
  access: [ALL, OWN, SCOPED, NONE]

# Every document (Markdown artifact) needs these frontmatter keys (D-18).
required_frontmatter: [id, artifact_type, title, status, version, baseline, origin, updated_at]

# Frontmatter `relations` keys → graph edge from the document's subject (D-21, D-64).
relation_edges:
  business_process: {edge: BELONGS_TO}
  requirements: {edge: SATISFIES}
  actors: {edge: PERFORMS, reverse: true}
  business_rules: {edge: USES_RULE}
  entities_read: {edge: READS}
  entities_written: {edge: WRITES}
  screens: {edge: USES_SCREEN}
  apis: {edge: USES_API}
  integrations: {edge: USES_INTEGRATION}
  messages: {edge: SHOWS}
  email_templates: {edge: SENDS}
  common_use_cases: {edge: FOLLOWS}

# Catalog items `ba stamp` records in built_from, so a document turns STALE when one changes.
# Screens and APIs are outputs of the spec engine itself, so they are excluded. Messages and email templates
# are included: a screen or a behaviour shows their text (D-52).
stamp_ref_prefixes: [UC, BP, ACT, BR, ENT, REQ, INT, Q, ASM, CMUC, EMSG, IEM, CFD, SCD, INF, ET]

artifact_types:
  # ---- Input Management
  elicitation-summary:
    path: input-management/elicitation/elicitation-summary.md
    id: ELICITATION
    headings: [Sources, Current Need, Future Need, Gap Analysis, Clarification Questions, Decisions,
               Requirements Summary]

  # ---- High Level Requirements
  product-overview:
    path: high-level-requirements/product-overview.md
    id: PRODUCT
    headings: [Objective, Scope, Actors, Applications, System Boundaries, Integrations, High-Level Behavior]
  workflow:
    # D-56: one document per business process — a swimlane diagram and the workflow explanation
    path: high-level-requirements/workflows/{BP}.md
    per_item: business-processes
    headings: [Workflow Diagram, Workflow Explanation]
    checks: [mermaid, workflow_steps]
  site-map:
    # D-58: every user-facing application (Phase 4A, formerly "information architecture")
    path: high-level-requirements/site-map/{APP}.md
    per_item: applications
    headings: [Site Map, Pages, Application Structure, Menu, Entry Points]
    checks: [mermaid, site_map_pages]

  # ---- Other Requirements (D-53): BA-owned conventions, adapted from company-standards/
  field-controls:
    path: other-requirements/field-controls.md
    id: FIELD-CONTROLS
    headings: [Common Field Controls, Other Component Types]
    checks: [field_controls]
  message-configuration:
    path: other-requirements/message-configuration.md
    id: MESSAGE-CONFIGURATION
    headings: [Common Messages Configuration]
  list-behaviour:
    path: other-requirements/list-behaviour.md
    id: LIST-BEHAVIOUR
    headings: [View Columns Display, Pagination, Search Component, Bulk Action]

  # ---- Technical baseline (Phase 6A)
  technical-architecture:
    path: technical/architecture/architecture.md
    id: ARCH
    headings: [Technology Stack, Application Architecture, Repository Structure, API Conventions,
               Error Handling, Logging, Testing Conventions]
  coding-rules:
    path_regex: '^technical/coding-rules/[a-z0-9-]+\.md$'
    id_regex: '^CODING-[A-Z0-9-]+$'
    headings: [Conventions]
  security-rules:
    path: technical/security/security-rules.md
    id: SECURITY
    headings: [Authentication, Authorization, Data Protection, Audit]
  design-system:
    # D-53: visual design only; behaviour conventions are Other Requirements
    path: technical/design-system.md
    id: DESIGN-SYSTEM
    headings: [Principles, Layout, Components]

  # ---- per use case: Spec Engine (master spec §13–21, addendum D-48 – D-51)
  ui-markdown:
    per_use_case: true
    path: functional-requirements/mockup-screens/{UC}.md
    headings: [Purpose, Screens, Navigation, Open Questions]
    checks: [screen_sections, component_tables, message_texts]
    ui: true
  ui-prototype:
    per_use_case: true
    path: functional-requirements/mockup-screens/prototypes/{UC}/README.md
    dir: functional-requirements/mockup-screens/prototypes/{UC}/
    headings: [How to Open, Screens Covered, Interactions, Limitations]
    checks: [prototype_index]
    ui: true
  use-case-behaviour:
    # D-48: activities flow, step rules (UC-NNN-BR-nn), alternate and error flows; emails are cited by ET ID
    per_use_case: true
    path: functional-requirements/use-case-specifications/{UC}/behaviour.md
    headings: [Use Case Description, Activities Flow, Business Rules, Alternate Flows, Error Flows]
    scoped: [BR, AF, EF]
    checks: [mermaid, behaviour]
  sequence:
    per_use_case: true
    path: technical/sequence/{UC}.md
    headings: [Participants, Main Flow, Alternate and Error Flows, Notes]
    checks: [mermaid]
  api-design:
    per_use_case: true
    path: technical/api/{UC}.md
    headings: [API Summary, API Details, Unresolved Technical Decisions]
    checks: [api_sections]
  acceptance-criteria:
    per_use_case: true
    path: functional-requirements/use-case-specifications/{UC}/acceptance.md
    headings: [Acceptance Criteria, Coverage]
    scoped: [AC]
    checks: [gherkin]
  use-case-specification:
    # D-49: the company skeleton first, then the kit's technical sections; assembled by `tools/ba compile`
    per_use_case: true
    path: functional-requirements/use-case-specifications/{UC}/spec.md
    headings: [Use Case Description, Activities Flow, Business Rules, Alternate Flows, Error Flows,
               Common Business Rules, Screens, Messages, Email Templates, Data Entities, Business Context,
               Sequence Diagram, API Specification, Acceptance Criteria, Dependencies, Assumptions,
               Open Questions, Traceability]
    checks: [mermaid, compiled_spec]

  # ---- per use case: delivery (master spec Phases 7–9)
  implementation:
    per_use_case: true
    path: technical/implementation/{UC}.md
    headings: [Implementation Plan, Repositories and Branch, Changed Files, Automated Test Results,
               Traceability, Deviations and Open Points]
    checks: [implementation_refs]
  test-cases:
    per_use_case: true
    path: qa/test-cases/{UC}.md
    headings: [Test Cases, Coverage]
    checks: [test_cases]
  test-results:
    per_use_case: true
    path: qa/test-results/{UC}.md
    headings: [Summary, Environment, Results, Requirement Comparison]
    checks: [test_results]
  defects:
    per_use_case: true
    path: qa/defects/{UC}.md
    headings: [Defects]
    scoped: [DEF]
    checks: [defects]
  user-guide:
    per_use_case: true
    path: user-guide/{UC}/guide.md
    dir: user-guide/{UC}/
    headings: [Purpose, Who Can Use This Feature, Preconditions, Process Overview, Expected Result,
               Common Errors, Troubleshooting]
    checks: [user_guide]
