schema_version: 2
# Catalogs hold many items per file (addendum D-17). Every item has a stable ID (D-14).
# Paths follow the company SRS structure (addendum D-45).
#   required:      fields that must be present and non-empty
#   required_when: field -> {other field: value}: the field is required only when the other field has that value
#   enums:         allowed values for a scalar field
#   list_enums:    allowed values for each entry of a list field
#   booleans:      fields that must be true or false
#   refs:          field -> ID prefixes it may reference + the graph edge it creates.
#                  reverse: true means the edge points from the referenced ID to this item.
#   item_refs:     list-of-mappings field -> the key holding an ID, its prefixes, the edge, and the keys
#                  copied onto the edge (e.g. a use case's permissions per actor, addendum D-46)
#   prefix_by:     the ID prefix depends on a field's value (messages: the type gives the code, D-52)
#   numbered:      list field whose entries get scoped IDs <ID>-<kind>NN when added without one
catalogs:
  # ------------------------------------------------------------ Input Management
  requirements:
    title: Requirements
    path: input-management/elicitation/requirements.yaml
    prefix: REQ
    node_type: Requirement
    required: [id, name, description, source, priority, type]
    required_when:
      category: {type: NON_FUNCTIONAL}
      criteria: {type: NON_FUNCTIONAL}
    enums:
      priority: [HIGH, MEDIUM, LOW]
      type: [FUNCTIONAL, NON_FUNCTIONAL]          # D-54: NFRs are typed requirements, not a separate prefix
      # The company SRS's Non-Functional Requirements sections, finer-grained (publication groups them back)
      category: [PERFORMANCE, SCALABILITY, PLATFORM, SAFETY, SECURITY, USABILITY, ACCESSIBILITY,
                 INTERNATIONALISATION, AVAILABILITY, RELIABILITY, ACCURACY, COMPLIANCE, CONSTRAINT]

  open-questions:
    title: Open Questions
    path: input-management/elicitation/open-questions.yaml
    prefix: Q
    node_type: OpenQuestion
    name_field: question
    required: [id, question, reason, impact_if_unanswered, target_stakeholder, priority, status]
    enums:
      target_stakeholder: [BUSINESS, OPERATIONS, SECURITY, DATA, INTEGRATION, COMPLIANCE, TECHNICAL, UX]
      priority: [HIGH, MEDIUM, LOW]
      status: [OPEN, ANSWERED, CLOSED]
    # blocking: true — must be answered by stakeholders before the overview can be written (master §8, 2.5)
    booleans: [blocking]
    refs:
      related: {targets: ANY, edge: ABOUT}

  assumptions:
    title: Assumptions
    path: input-management/elicitation/assumptions.yaml
    prefix: ASM
    node_type: Assumption
    name_field: statement
    required: [id, statement, reason, status]
    enums:
      status: [OPEN, CONFIRMED, REJECTED]
    refs:
      related: {targets: ANY, edge: ABOUT}

  # ------------------------------------------------------------ High Level Requirements
  actors:
    title: Actors
    path: high-level-requirements/actors.yaml
    prefix: ACT
    node_type: Actor
    required: [id, name, type, description]
    required_when:
      # D-56: how the system recognises the user, e.g. "the HR role assignments include PROJECT_MANAGER"
      role_mapping: {type: HUMAN}
    enums:
      type: [HUMAN, SYSTEM]

  applications:
    title: Applications
    path: high-level-requirements/applications.yaml
    prefix: APP
    node_type: Application
    required: [id, name, type, description]
    enums:
      type: [WEB, MOBILE, DESKTOP, BACKOFFICE]
      # Every user-facing application gets a site map (D-58). REQUIRED: its navigation is designed from scratch
      # (a new application or a major navigation change, master §12). NOT_REQUIRED: the site map documents the
      # existing navigation.
      information_architecture: [REQUIRED, NOT_REQUIRED]
    refs:
      actors: {targets: [ACT], edge: USES_APPLICATION, reverse: true}
      services: {targets: [SVC], edge: USES}

  integrations:
    title: Integrations
    path: high-level-requirements/integrations.yaml
    prefix: INT
    node_type: Integration
    required: [id, name, direction, purpose, owner]
    enums:
      direction: [INBOUND, OUTBOUND, BIDIRECTIONAL]
    # system: the external system's name, shown in the Object Relationship Diagram (D-59)
    refs:
      entities: {targets: [ENT], edge: EXCHANGES}

  entities:
    title: Objects (data model)
    path: high-level-requirements/objects.yaml
    prefix: ENT
    node_type: Entity
    required: [id, name, description, owner, attributes]
    # attributes[]: name, type, description, and optional constraints (D-56): mandatory, unique, max_length,
    # format, allowed_values, default, generated (the format of a generated value)

  business-processes:
    title: Business Processes
    path: high-level-requirements/business-processes.yaml
    prefix: BP
    node_type: BusinessProcess
    required: [id, name, objective, actors, trigger, steps]
    # steps[]: id <BP>-Snn, name, actor, use_cases, description, and optional branches (D-56):
    #   next: [{to: <step id> | END, when: <condition>}]
    refs:
      actors: {targets: [ACT], edge: PARTICIPATES_IN, reverse: true}

  business-rules:
    title: Business Rules (policy and common)
    path: high-level-requirements/business-rules.yaml
    prefix: BR
    node_type: BusinessRule
    required: [id, name, description, source, kind]
    enums:
      # D-47: POLICY — a constraint the business imposes (limits, eligibility, deadlines);
      #       COMMON — a procedural rule several use cases apply by reference (the company's "CBR", e.g. the audit trail)
      kind: [POLICY, COMMON]
    refs:
      requirements: {targets: [REQ], edge: DERIVED_FROM}
      related_use_cases: {targets: [UC], edge: USES_RULE, reverse: true}
      related_entities: {targets: [ENT], edge: APPLIES_TO}

  use-cases:
    # D-46: a use case is one function — the row of the use case diagram and of the permission matrix.
    title: Use Cases (functions)
    path: high-level-requirements/use-cases.yaml
    prefix: UC
    node_type: UseCase
    required: [id, name, objective, business_process, actor, application, object, permissions, description,
               complexity, risk_level]
    enums:
      complexity: [LOW, MEDIUM, HIGH]
      risk_level: [LOW, MEDIUM, HIGH, CRITICAL]
    list_enums:
      risk_flags: [FINANCIAL, IRREVERSIBLE, SECURITY, COMPLIANCE, PERSONAL_DATA]
    # objective:      completes "This function allows <actors> to …", e.g. "submit a leave request"
    # permissions[]:  {actor, access: ALL (O) | OWN (O*) | SCOPED (O**) | NONE (X), scope}. Actors not listed: X.
    # allowed_states: states of the object's lifecycle in which the function is allowed (empty: any state)
    # transitions:    lifecycle transitions it performs, "FROM -> TO" ((new) for creation)
    # follows:        the common use cases it follows; its behaviour then specifies only what differs (D-50)
    refs:
      business_process: {targets: [BP], edge: BELONGS_TO}
      actor: {targets: [ACT], edge: PERFORMS, reverse: true}
      application: {targets: [APP], edge: RUNS_IN}
      object: {targets: [ENT], edge: ACTS_ON}
      follows: {targets: [CMUC], edge: FOLLOWS}
      requirements: {targets: [REQ], edge: SATISFIES}
      business_rules: {targets: [BR], edge: USES_RULE}
      entities_read: {targets: [ENT], edge: READS}
      entities_written: {targets: [ENT], edge: WRITES}
    item_refs:
      permissions: {key: actor, targets: [ACT], edge: MAY_PERFORM, reverse: true, attrs: [access, scope]}

  # ------------------------------------------------------------ Functional Requirements
  common-use-cases:
    title: Common Use Cases
    path: functional-requirements/common-use-cases.yaml
    prefix: CMUC
    node_type: CommonUseCase
    required: [id, name, operation, objective, trigger, pre_condition, post_condition, activities_flow,
               step_rules]
    enums:
      operation: [VIEW_LIST, CREATE, READ, UPDATE, DELETE, DISABLE, SEARCH, OTHER]
    # step_rules[]: {id <CMUC>-BR-nn, step, type (see step_rule_type), title "<Type> Rules", description}
    numbered:
      step_rules: BR

  screens:
    title: Screen Catalog
    path: functional-requirements/mockup-screens/screen-catalog.yaml
    prefix: SCR
    node_type: Screen
    required: [id, name, application, purpose]
    refs:
      application: {targets: [APP], edge: CONTAINS, reverse: true}
      actors: {targets: [ACT], edge: ACCESSES, reverse: true}
      apis: {targets: [API], edge: CALLS}
      use_cases: {targets: [UC], edge: USES_SCREEN, reverse: true}

  # ------------------------------------------------------------ Agile Project
  user-stories:
    # D-60: tracking items, one or more per use case; the use case stays the specification and delivery unit.
    title: User Stories
    path: agile-project/user-stories.yaml
    prefix: US
    node_type: UserStory
    required: [id, name, use_case, story]
    refs:
      use_case: {targets: [UC], edge: REALIZES}
      acceptance_criteria: {targets: [UC], edge: ACCEPTED_BY}     # <UC>-AC-nn; empty: all of the use case's

  # ------------------------------------------------------------ Appendices
  messages:
    title: Message List
    path: appendices/messages.yaml
    prefix_by:
      field: type
      prefixes: {ERROR_DIALOG: EMSG, INLINE_ERROR: IEM, CONFIRMATION: CFD, SUCCESS: SCD, INFORMING: INF}
    node_type: Message
    name_field: text
    required: [id, type, text]
    enums:
      type: [ERROR_DIALOG, INLINE_ERROR, CONFIRMATION, SUCCESS, INFORMING]

  email-templates:
    title: Email Templates
    path: appendices/email-templates.yaml
    prefix: ET
    node_type: EmailTemplate
    # name: "Sending email to <recipient> after <event>"; placeholders[]: {name, source} for every <<Name>>
    required: [id, name, trigger, to, subject, body, placeholders]

  glossary:
    title: Glossary
    path: appendices/glossary.yaml
    prefix: TERM
    node_type: GlossaryTerm
    name_field: term
    required: [id, term, kind, definition]
    enums:
      kind: [TERM, ABBREVIATION, NOTATION]

  # ------------------------------------------------------------ Technical (unchanged)
  repositories:
    title: Repositories
    path: workflow/repositories.yaml
    prefix: REPO
    node_type: Repository
    required: [id, name, type, status]
    enums:
      status: [PLANNED, ACTIVE, ARCHIVED]

  services:
    title: Services
    path: technical/architecture/services.yaml
    prefix: SVC
    node_type: Service
    required: [id, name, responsibility]
    refs:
      repository: {targets: [REPO], edge: LOCATED_IN}
      integrations: {targets: [INT], edge: INTEGRATES_WITH}
      entities: {targets: [ENT], edge: OWNS}

  apis:
    title: API Catalog
    path: technical/api/api-catalog.yaml
    prefix: API
    node_type: API
    name_field: endpoint
    required: [id, method, endpoint, purpose, service, change_type]
    enums:
      method: [GET, POST, PUT, PATCH, DELETE]
      change_type: [EXISTING, NEW, MODIFIED]
    refs:
      service: {targets: [SVC], edge: IMPLEMENTED_BY}
      calls: {targets: [API], edge: CALLS}
      entities_read: {targets: [ENT], edge: READS}
      entities_written: {targets: [ENT], edge: WRITES}
      introduced_by: {targets: [UC], edge: INTRODUCES, reverse: true}
